name: Threads 매일 게시

on:
  schedule:
    # 매일 한국시간 오후 12:37 (UTC 03:37)
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 실제 게시 없이 미리보기만"
        required: false
        default: "1"
      post_date:
        description: "특정 날짜 글 테스트 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: Threads 계정 연결 확인
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, requests
          raw = os.environ.get("THREADS_ACCESS_TOKEN", "")
          tok = raw.strip()
          print(f"토큰 점검: 길이 {len(tok)}자, 시작 {tok[:2]!r}, 앞뒤 공백/줄바꿈 {'있음(자동 제거)' if raw != tok else '없음'}, 중간 공백 {'있음' if any(c.isspace() for c in tok) else '없음'}")
          r = requests.get("https://graph.threads.net/v1.0/me",
                           params={"fields": "id,username", "access_token": tok},
                           timeout=30)
          if not r.ok:
              sys.exit(f"토큰 확인 실패: {r.status_code} {r.text}")
          print("연결된 Threads 계정:", r.json().get("username"))
          PY

      - name: 오늘 글 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PRODUCT_LINK: ${{ secrets.PRODUCT_LINK }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          POST_DATE: ${{ github.event.inputs.post_date || '' }}
        # 지금 저장소에는 스크립트와 posts.csv가 .github/workflows 폴더에 있어서 그 경로로 실행합니다.
        run: python .github/workflows/threads_post.py
